  root_cause:
    classification: SDK_PROTOCOL_SHAPE_ASSUMPTION
    finding: >-
      Spondee correctly generated the Promise Card before signing, but placed it in the custom
      terms.spondee_promise field. Official @bnbagent/sdk NegotiationRequest.fromDict reconstructs
      terms through TermSpecification, which preserves only protocol fields such as deliverables,
      quality_standards and success_criteria; arbitrary custom term keys are dropped before the
      request/response hashes, provider signature and NegotiationResult.toDict envelope are produced.
    consequence: >-
      The buyer correctly failed before createJob when the custom Promise field was absent. The previous
      test suite was insufficient because its fake signQuote seam inspected the pre-SDK request rather than
      the real serialized NegotiationResult shape.

  applied_fix:
    carrier: success_criteria
    carrier_prefix: 'SPONDEE_PROMISE_CARD_V1:'
    security_properties:
      - Promise Card is carried only through an official TermSpecification field preserved by the SDK
      - request and response must each contain exactly one Spondee Promise carrier
      - request and response carrier strings must match exactly
      - buyer verifies provider signature, chain and Commerce contract before trusting the Promise Card
      - seller delivery reads the same carrier back from the on-chain JobDescription terms
      - missing, malformed, duplicate or mismatched carriers fail closed before createJob
    commits:
      seller_carrier: ed74abdcf8496c8beb34dd9751deaaeca4d52250
      buyer_decoder_and_verification_order: 05191e522507b71858c8a43b96dca802a4a5eb90
