  - id: DEC-011
    date: '2026-09-03'
    decision: After Backend CI 33816310524 and G3 CI 33816544907 passed, authorize exactly one local MegaFuel-backed Health Factor E2E retry using the existing seller keystore.
    status: CONSUMED_BY_THIRD_ATTEMPT_FAIL_CLOSED
    authority: PBPD_WITHIN_EXISTING_HUMAN_TESTNET_GO
  - id: DEC-012
    date: '2026-09-03'
    decision: Keep the full Spondee Promise Card off-chain as a read-only preview and carry only a compact signed SHA-256 commitment in ERC-8183 success_criteria using SPONDEE_PROMISE_COMMITMENT_V1.
    status: ACCEPTED
    authority: PBPD_PROTOCOL_RECONCILIATION
    constraints:
      - commitment carries promise_id, scenario_id, raw price and canonical Promise SHA-256
      - compact wire keys are p, s, r and h
      - signed request and response each contain exactly one identical commitment
      - provider signature, chain and Commerce contract are verified before commitment trust
      - preview Promise id/scenario/price/hash must match commitment before createJob
      - seller reconstructs the deterministic Promise and rechecks id/hash before Outcome Receipt
      - buildJobDescription must fit a 1600-byte Spondee MegaFuel application cap before createJob
    evidence:
      - backend/src/erc8183.ts
      - backend/src/erc8183.test.ts
      - reference-agents/health-factor/app/agent/src/healthFactor.ts
      - GitHub Actions run 33817822355
      - GitHub Actions run 33817846752
  - id: DEC-013
    date: '2026-09-03'
    decision: Encode the signed Health Factor task as versioned Base64URL JSON using SPONDEE_TASK_B64_V1 so stress_path arrays survive the official SDK claim sanitizer byte-for-byte.
