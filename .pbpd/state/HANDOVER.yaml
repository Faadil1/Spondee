  root_cause:
    classification: MEGAFUEL_RAW_TRANSACTION_SIZE
    finding: >-
      The full Spondee Promise Card had been embedded verbatim in signed success_criteria. That made
      the ERC-8183 JobDescription 2223 bytes before ABI/RLP overhead. MegaFuel rejected the resulting
      createJob raw transaction as too large, then the SDK self-pay fallback correctly failed because
      the ephemeral buyer had zero tBNB. MegaFuel sponsorship itself remains previously runtime-proven.
    secondary_protocol_hazard: >-
      The official SDK claim sanitizer replaces square brackets. A raw JSON Health Factor task contains
      stress_path arrays, so storing that JSON directly as task_description would corrupt the signed/on-chain
      task representation even if createJob succeeded.

  applied_fix:
    promise_model:
      full_promise: obtained from read-only preview_health_factor before negotiation
      signed_carrier: success_criteria
      carrier_prefix: 'SPONDEE_PROMISE_COMMITMENT_V1:'
      compact_wire_fields: [p, s, r, h]
      semantics:
        p: promise_id
        s: scenario_id
        r: raw service price
        h: canonical SHA-256 of full Promise Card
    task_model:
      carrier_prefix: 'SPONDEE_TASK_B64_V1:'
      encoding: BASE64URL_JSON
      purpose: survive SDK claim sanitizer byte-for-byte while preserving stress_path arrays
    safety_checks:
      - preview Promise must be a valid SIMULATION Spondee Promise Card
      - provider signature, chain and Commerce contract verified before commitment trust
      - request and response require exactly one identical signed commitment
      - preview promise_id, scenario_id, price and SHA-256 must match signed commitment
      - signed encoded task must exactly match the task sent by the buyer
      - seller reconstructs the same deterministic Promise from signed task and committed price
      - seller refuses fulfillment if reconstructed promise_id or SHA-256 differs
      - buildJobDescription must fit Spondee 1600-byte application cap before createJob
    commits:
      compact_commitment_and_task_carrier: afdab100a598e0a9bfecfc0b75b56f8541d78ec9
      compact_live_driver: 109d2cfed109838aa209c4cd6d716dbae1cdca01
