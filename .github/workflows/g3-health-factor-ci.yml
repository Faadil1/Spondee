name: G3 Health Factor CI

on:
  push:
    branches: ['build/g3-health-factor']
    paths:
      - 'reference-agents/health-factor/**'
      - '.github/workflows/g3-health-factor-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'reference-agents/health-factor/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate

      - name: Install workspace dependencies
        working-directory: reference-agents/health-factor
        run: pnpm install --frozen-lockfile

      - name: Validate local PowerShell wallet helper syntax
        shell: pwsh
        run: |
          $path = 'reference-agents/health-factor/scripts/g3-create-testnet-wallet.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell wallet helper syntax: PASS'

      - name: Run deterministic Spondee tests
        working-directory: reference-agents/health-factor/app/agent
        run: pnpm test

      - name: TypeScript build
        working-directory: reference-agents/health-factor/app/agent
        run: pnpm build

      - name: Export reproducible Promise and Receipt evidence
        working-directory: reference-agents/health-factor/app/agent
        run: pnpm demo:evidence

      - name: Upload deterministic demo evidence
        uses: actions/upload-artifact@v4
        with:
          name: spondee-g3-health-factor-demo-evidence
          path: reference-agents/health-factor/demo-output/
          if-no-files-found: error
          retention-days: 14

      - name: Agent Studio diagnostics
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @bnbagent/studio-cli
          cd reference-agents/health-factor
          # Git cannot preserve the empty runtime wallet directory emitted by
          # bag init. Recreate the directory only; do not create/import a key.
          mkdir -p .studio/wallets
          bag scan
          bag doctor
