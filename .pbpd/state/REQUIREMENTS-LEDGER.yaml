  - id: MUST-08
    class: MUST
    requirement: Every completed measured run creates an Outcome Receipt.
    status: PARTIAL_THREE_LIVE_TRANSPORT_RECEIPTS_VERIFIED_SIMULATION_OBSERVED_RUNS_PENDING
    evidence: evidence/g4-rebalancing-job-955-final-pass/README.md
  - id: MUST-09
    class: MUST
    requirement: Outcome Receipt binds original promise to actual result.
    status: VERIFIED_HEALTH_FACTOR_GRID_REBALANCING_LIVE_PROMISE_RECEIPT_BINDING_SIMULATION_EVIDENCE
