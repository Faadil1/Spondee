    evidence: evidence/g4-grid-job-954-final-pass/README.md
  - id: MUST-12
    class: MUST
    requirement: Baseline timings, costs and results are observed or reproducible, never invented.
    status: ACTIVE_VERIFIED_EVIDENCE_GUARDRAIL_OBSERVED_BASELINES_PENDING
    evidence: backend/src/evidence.ts
  - id: MUST-13
    class: MUST
    requirement: Health Factor hero measures useful warning lead time and response latency.
    status: PARTIAL_WARNING_LEAD_SIMULATION_VERIFIED_OBSERVED_EVENT_TAPE_PENDING
    evidence: evidence/g3-job-949-final-pass/README.md
  - id: MUST-14
    class: MUST
    requirement: Public product remains accessible during judging.
    status: PENDING_PUBLIC_DEPLOYMENT
    evidence_plan: Public URL smoke check. Current loopback deliverable URLs are not judge-accessible.
  - id: MUST-15
    class: MUST
    requirement: Failure states fail visibly rather than fabricating success.
    status: VERIFIED_CI_AND_LIVE_RUNTIME_FAIL_CLOSED_PATHS
    evidence: evidence/g4-rebalancing-job-955-final-pass/README.md
    note: Rebalancing preserved the FUNDED partial state, diagnosed deterministically, and recovered the same job without recreating chain state.
  - id: SHOULD-01
    class: SHOULD
    requirement: Show calibration history when enough completed runs exist.
    status: IMPLEMENTED_CONDITIONALLY_OBSERVED_HISTORY_PENDING
    evidence: backend/src/evidence.ts
  - id: SHOULD-02
    class: SHOULD
    requirement: Provide Decision Replay for measured runs.
    status: PENDING
  - id: SHOULD-03
    class: SHOULD
    requirement: Use Altana scoped session authority if core integration supports it.
    status: PENDING_AFTER_FOUR_CATEGORY_CORE
  - id: SHOULD-04
    class: SHOULD
    requirement: Add genuine PancakeSwap trader/LP benefit only after core product is complete.
    status: PENDING_AFTER_FOUR_CATEGORY_CORE
  - id: SHOULD-05
