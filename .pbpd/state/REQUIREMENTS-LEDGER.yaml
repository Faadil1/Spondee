  - id: MUST_NOT-07
    class: MUST_NOT
    requirement: Do not move meaningful real mainnet user capital without explicit human authorization.
    status: ACTIVE_THREE_COUNTABLE_PAIRS_USED_MAINNET_READ_ONLY_MARKET_DATA_NO_VALUE_MOVED
    evidence: evidence/g5-agent-advantage-3-of-3-final/README.md
  - id: MUST_NOT-08
    class: MUST_NOT
    requirement: Do not treat LLM-generated quality scores as ground truth.
