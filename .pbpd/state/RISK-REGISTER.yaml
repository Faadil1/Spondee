schema: PBPD-RISK-REGISTER-v0.1
risks:
  - id: R-01
    severity: CRITICAL
    risk: Scope exceeds the Sep 9 capacity window.
    mitigation: Freeze G4 at 4/4 PASS; first countable Grid pair is closed; prioritize Health Factor observed pair/event tape, one additional pair, and public judging availability over optional integrations.
    status: OPEN_PRIMARY_SCHEDULE_RISK
  - id: R-02
    severity: CRITICAL
    risk: Four-category depth becomes cosmetic or uneven.
    mitigation: All four categories have verified bounded live BSC-testnet paths with Promise and Outcome Receipt plumbing.
    status: RESOLVED_LIVE_TRANSPORT_4_OF_4
    evidence: evidence/g4-yield-job-957-final-pass/README.md
  - id: R-03
    severity: HIGH
    risk: Health Factor hero demo dominates the product and weakens Agent Diversity.
    mitigation: Grid, Rebalancing and Yield have equivalent live transport proof; Grid also has the first countable observed pair. Preserve comparable UI depth in public judge build.
    status: CONTROLLED_LIVE_DEPTH_CLOSED_UI_REVIEW_PENDING
  - id: R-04
    severity: HIGH
    risk: Agent confidence values are arbitrary or misleading.
    mitigation: Preserve forecast provenance, track calibration only against observed outcomes, and label insufficient history.
    status: OPEN_OBSERVED_CALIBRATION_HISTORY_INSUFFICIENT
  - id: R-05
    severity: CRITICAL
    risk: Baseline comparisons are biased, synthetic or invented but presented as observed Agent Advantage.
    mitigation: G5 countable schema requires marketplace activation, future/non-historical window, transaction tape, same scenario/input, raw outputs and measured metrics. Grid job 962 independently re-read every Chainlink round and computed the baseline from exactly those rounds.
    status: CONTROLLED_AND_FIRST_COUNTABLE_PAIR_VERIFIED__MUST_REPEAT_FOR_REMAINING_PAIRS
    evidence: evidence/g5-grid-forward-job-962-countable-pass/README.md
  - id: R-06
    severity: HIGH
    risk: External agent/API instability blocks the judge path.
    mitigation: Controlled Spondee Agent Studio paths own activation proof; external discovery candidates remain secondary when activation is opaque.
    status: CONTROLLED_BY_SPONDEE_FALLBACK_PATHS
  - id: R-07
    severity: MEDIUM
    risk: Altana integration consumes time before core evidence and deployment are complete.
    mitigation: Keep Altana writes blocked until observed evidence and public judging build are credible.
    status: CONTROLLED_BLOCKED
  - id: R-08
    severity: HIGH
    risk: Financial wording implies guarantees.
    mitigation: Use forecast/probability/outcome language and visible limitations. Grid job 962 explicitly preserves underperformance and labels paper accounting as non-realized PnL.
    status: CONTROLLED_GUARDRAIL_ACTIVE
    evidence: evidence/g5-grid-forward-job-962-countable-pass/README.md
  - id: R-09
    severity: HIGH
    risk: JigJoy/Syndicate collision consumes the available build window.
    mitigation: Strict gate sequencing and no optional platform expansion until Spondee is submission-ready.
    status: OPEN_CAPACITY_RISK
  - id: R-10
    severity: CRITICAL
    risk: Current verified deliverable URLs are loopback-only and cannot serve judges publicly.
    mitigation: Preserve local/testnet evidence, then deploy a public judging build and verify public URL/journey health before submission.
    status: OPEN_PUBLIC_DEPLOYMENT_BLOCKER
  - id: R-11
    severity: CRITICAL
    risk: A live ERC-8004 registration is mistaken for a proven Spondee activation path.
    mitigation: Keep external candidates activatable=false until their Spondee task interface is independently verified; controlled Spondee paths own activation proof.
    status: CONTROLLED_EXTERNAL_CANDIDATES_DISCOVERY_ONLY
  - id: R-12
    severity: HIGH
    risk: BSC Testnet RPC eth_getLogs limits can falsely fail a live path after provider submit.
    mitigation: Live buyers consume exact provider submit transactions and decode exact receipts; historical submit log scans remain forbidden.
    status: RESOLVED_BY_DIRECT_SUBMIT_RECEIPT_AND_CI_INVARIANT
  - id: R-13
    severity: HIGH
    risk: Buyer and seller disagree on notify_funded response semantics, causing a false failure after FUND.
    mitigation: Observed forward sellers use an explicit bounded wait contract and return the exact submit transaction after the observation completes.
    status: CONTROLLED_AND_VERIFIED_JOB_962
  - id: R-14
    severity: HIGH
    risk: Closed jobs are accidentally recreated or mutated.
    mitigation: Jobs 949/954/955/957 and now 962 are canonically closed; future pairs require a dedicated gate and new task scope.
    status: CONTROLLED_CLOSED_JOB_GUARD_949_954_955_957_962
  - id: R-15
    severity: CRITICAL
    risk: Existing SIMULATION receipts or the historical observed dry-run are accidentally counted toward the required three pairs.
    mitigation: Countability requires LIVE_BSC_TESTNET_MARKETPLACE, activation reference, transaction tape and non-historical mode. Only Grid job 962 currently satisfies this contract.
    status: RESOLVED_AT_SCHEMA_LEVEL__FIRST_REAL_COUNTABLE_PAIR_RECORDED_1_OF_3
    evidence: evidence/g5-grid-forward-job-962-countable-pass/README.md
  - id: R-16
    severity: HIGH
    risk: Observed trading evidence requires meaningful real capital or introduces unacceptable financial risk.
    mitigation: Grid job 962 used zero-price BSC-testnet marketplace transport plus read-only BNB-mainnet Chainlink data and paper accounting; no mainnet value moved.
    status: RESOLVED_FOR_REQUIRED_TRADING_PAIR
    evidence: evidence/g5-grid-forward-job-962-countable-pass/README.md
  - id: R-17
    severity: HIGH
    risk: A paper Grid record is described as realized mainnet trading performance.
    mitigation: Task, seller output, pair limitations and final result explicitly state paper accounting and no realized mainnet PnL; observed underperformance is preserved.
    status: CONTROLLED_CLAIM_GUARDRAIL_VERIFIED_JOB_962
    evidence: evidence/g5-grid-forward-job-962-countable-pass/README.md
  - id: R-18
    severity: HIGH
    risk: A forward observation times out before enough future rounds arrive, leaving a partial marketplace job.
    mitigation: Job 962 successfully collected all eight rounds inside the bounded window. Future forward-style pairs must preserve the same fail-closed recovery rule.
    status: RESOLVED_FOR_GRID_JOB_962__REUSABLE_PATTERN_REQUIRED_FOR_FUTURE_FORWARD_PAIRS
  - id: R-19
    severity: HIGH
    risk: Future market rounds are accidentally backfilled from before marketplace funding, invalidating the observed pair.
    mitigation: Seller filters on observation start; buyer independently enforces the temporal boundary and re-reads exact source records.
    status: RESOLVED_FOR_GRID_JOB_962_BY_TEMPORAL_AND_SOURCE_VERIFICATION
    evidence: evidence/g5-grid-forward-job-962-countable-pass/README.md
  - id: R-20
    severity: MEDIUM
    risk: Seller dependency drift breaks the forward runtime.
    mitigation: Frozen workspace, tests and TypeScript build passed; compact wire remediation passed authoritative CI run 33859221865 before job 962.
    status: RESOLVED_FOR_GRID_RUNTIME
    evidence: evidence/g5-grid-forward-prewrite-size-failclosed-remediation/README.md
  - id: R-21
    severity: CRITICAL
    risk: Health Factor event tape is generated from simulation or post-hoc thresholds and presented as observed warning advantage.
    mitigation: Next Health Factor pair must freeze position, warning threshold, intervention rule and without-agent baseline before the observation window; preserve raw observed inputs and warning/intervention/adverse-event timestamps; dry-run remains non-countable until a dedicated marketplace activation exists.
    status: OPEN_NEXT_GATE_BLOCKER
  - id: R-22
    severity: HIGH
    risk: Health Factor baseline cadence is chosen after seeing the event, biasing warning lead-time or response-latency comparison.
    mitigation: Baseline cadence/rule must be precommitted in the frozen input snapshot and run against the exact same observed window and initial state.
    status: OPEN_NEXT_GATE_DESIGN_RISK
  - id: A-01
    severity: CRITICAL
    risk: No credible live BSC agent/path exists for one or more required categories.
    status: RESOLVED_FOUR_OF_FOUR_LIVE
  - id: A-02
    severity: CRITICAL
    risk: Task-specific promises cannot be produced before activation.
    status: RESOLVED_BY_LIVE_E2E_AND_G5_COUNTABLE_GRID_PAIR
  - id: A-03
    severity: HIGH
    risk: Promise-to-actual provenance cannot be bound reliably.
    status: RESOLVED_G4_LIVE_BINDING__G5_COUNTABLE_GRID_BINDING_PASS
  - id: A-06
    severity: CRITICAL
    risk: TermiX-style observed baselines cannot be collected reproducibly before deadline.
    mitigation: Grid job 962 proved one full marketplace-hired forward pair with preserved same-window baseline and raw evidence; repeat the pattern for two additional tasks.
    status: PARTIALLY_RESOLVED_ONE_OF_THREE_COUNTABLE_PAIRS_COMPLETE
