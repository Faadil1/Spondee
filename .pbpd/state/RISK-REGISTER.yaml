schema: PBPD-RISK-REGISTER-v0.1
risks:
  - id: R-01
    severity: CRITICAL
    risk: Scope exceeds the Sep 9 capacity window.
    mitigation: Freeze G4 at 4/4 PASS; prioritize first countable Grid pair, two additional observed pairs and public judging availability over optional integrations.
    status: OPEN_PRIMARY_SCHEDULE_RISK
  - id: R-02
    severity: CRITICAL
    risk: Four-category depth becomes cosmetic or uneven.
    mitigation: All four categories have verified bounded live BSC-testnet paths with Promise and Outcome Receipt plumbing.
    status: RESOLVED_LIVE_TRANSPORT_4_OF_4
    evidence: evidence/g4-yield-job-957-final-pass/README.md
  - id: R-03
    severity: HIGH
    risk: Health Factor hero demo dominates the product and weakens Agent Diversity.
    mitigation: Grid, Rebalancing and Yield have equivalent live transport proof; preserve comparable UI depth in public judge build.
    status: CONTROLLED_LIVE_DEPTH_CLOSED_UI_REVIEW_PENDING
  - id: R-04
    severity: HIGH
    risk: Agent confidence values are arbitrary or misleading.
    mitigation: Preserve forecast provenance, track calibration only against observed outcomes, and label insufficient history.
    status: OPEN_OBSERVED_EVIDENCE_PENDING
  - id: R-05
    severity: CRITICAL
    risk: Baseline comparisons are biased, synthetic or invented but presented as observed Agent Advantage.
    mitigation: G5 countable schema requires marketplace activation, future/non-historical window, transaction tape, same scenario/input, raw outputs and measured metrics. Grid forward buyer independently rereads every Chainlink round and computes the baseline from exactly those rounds.
    status: CONTROLLED_FORWARD_PREFLIGHT_PASS_FIRST_COUNTABLE_PAIR_PENDING
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
  - id: R-06
    severity: HIGH
    risk: External agent/API instability blocks the judge path.
    mitigation: Controlled Spondee Agent Studio paths own activation proof; external discovery candidates remain secondary when activation is opaque.
    status: CONTROLLED_BY_SPONDEE_FALLBACK_PATHS
  - id: R-07
    severity: MEDIUM
    risk: Altana integration consumes time before core evidence and deployment are complete.
    mitigation: Keep Altana writes blocked until observed evidence and public judging build are credible.
    status: CONTROLLED_BLOCKED
  - id: R-08
    severity: HIGH
    risk: Financial wording implies guarantees.
    mitigation: Use forecast/probability/outcome language and visible limitations; forward Grid explicitly labels strategy returns as paper-only and never realized mainnet PnL.
    status: OPEN_GUARDRAIL_ACTIVE
  - id: R-09
    severity: HIGH
    risk: JigJoy/Syndicate collision consumes the available build window.
    mitigation: Strict gate sequencing and no optional platform expansion until Spondee is submission-ready.
    status: OPEN_CAPACITY_RISK
  - id: R-10
    severity: CRITICAL
    risk: Current verified deliverable URLs are loopback-only and cannot serve judges publicly.
    mitigation: Preserve local/testnet evidence, then deploy a public judging build and verify public URL/journey health before submission.
    status: OPEN_PUBLIC_DEPLOYMENT_BLOCKER
  - id: R-11
    severity: CRITICAL
    risk: A live ERC-8004 registration is mistaken for a proven Spondee activation path.
    mitigation: Keep external candidates activatable=false until their Spondee task interface is independently verified; controlled Spondee paths own activation proof.
    status: CONTROLLED_EXTERNAL_CANDIDATES_DISCOVERY_ONLY
  - id: R-12
    severity: HIGH
    risk: BSC Testnet RPC eth_getLogs limits can falsely fail a live path after provider submit.
    mitigation: Live buyers consume exact provider submit transactions and decode exact receipts; historical submit log scans remain forbidden.
    status: RESOLVED_BY_DIRECT_SUBMIT_RECEIPT_AND_CI_INVARIANT
  - id: R-13
    severity: HIGH
    risk: Buyer and seller disagree on notify_funded response semantics, causing a false failure after FUND.
    mitigation: G5 forward seller requires bounded wait_for_result=true and returns the exact submit tx after the future observation completes.
    status: CONTROLLED_BY_EXPLICIT_BOUNDED_WAIT_FOR_RESULT
  - id: R-14
    severity: HIGH
    risk: Closed G4 jobs are accidentally recreated or mutated.
    mitigation: Jobs 949/954/955/957 are canonically closed; G5 uses a separate branch, task schema, runner and future job scope.
    status: CONTROLLED_CLOSED_JOB_GUARD
  - id: R-15
    severity: CRITICAL
    risk: Existing SIMULATION receipts or the historical observed dry-run are accidentally counted toward the required three pairs.
    mitigation: Countability requires LIVE_BSC_TESTNET_MARKETPLACE, activation reference, transaction tape and non-historical mode. Dry-run remains explicitly non-countable.
    status: RESOLVED_AT_SCHEMA_LEVEL_EXECUTION_EVIDENCE_STILL_PENDING
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
  - id: R-16
    severity: HIGH
    risk: Observed trading evidence requires meaningful real capital or introduces unacceptable financial risk.
    mitigation: G5 forward design uses zero-price BSC-testnet marketplace transport plus read-only BNB-mainnet Chainlink data and paper accounting. No mainnet value movement is implemented.
    status: CONTROLLED_FORWARD_RUNNER_PREFLIGHT_PASS
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
  - id: R-17
    severity: HIGH
    risk: A paper Grid record is described as realized mainnet trading performance.
    mitigation: Task, seller output, pair limitations and final result explicitly state paper accounting and no realized mainnet PnL.
    status: CONTROLLED_CLAIM_GUARDRAIL_ACTIVE
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
  - id: R-18
    severity: HIGH
    risk: The forward Chainlink window times out before enough future rounds arrive, leaving a partial marketplace job.
    mitigation: Target is bounded to eight future rounds with a 480-second ceiling. Runner must fail closed, preserve any partial job state and forbid blind retry until read-only diagnosis determines the exact state.
    status: OPEN_EXECUTION_RUNTIME_RISK
  - id: R-19
    severity: HIGH
    risk: Future market rounds are accidentally backfilled from before marketplace funding, invalidating the observed pair.
    mitigation: Seller filters on observation start; buyer independently enforces first counted round strictly after both Promise freeze and BSC-testnet funding and rereads exact Chainlink round IDs.
    status: CONTROLLED_BY_TEMPORAL_AND_SOURCE_VERIFICATION
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
  - id: R-20
    severity: MEDIUM
    risk: Seller dependency drift breaks the forward runtime.
    mitigation: Final seller removed undeclared viem import and uses native read-only JSON-RPC fetch; frozen workspace, G5 tests and TypeScript build pass in run 33845758154.
    status: RESOLVED_IN_PREFLIGHT
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
  - id: A-01
    severity: CRITICAL
    risk: No credible live BSC agent/path exists for one or more required categories.
    status: RESOLVED_FOUR_OF_FOUR_LIVE
  - id: A-02
    severity: CRITICAL
    risk: Task-specific promises cannot be produced before activation.
    status: RESOLVED_BY_LIVE_E2E_AND_G5_FORWARD_PROMISE_PREFLIGHT
  - id: A-03
    severity: HIGH
    risk: Promise-to-actual provenance cannot be bound reliably.
    status: RESOLVED_G4_LIVE_BINDING__G5_FORWARD_BINDING_PREFLIGHT_PASS
  - id: A-06
    severity: CRITICAL
    risk: TermiX-style observed baselines cannot be collected reproducibly before deadline.
    mitigation: Historical harness proved reproducibility; forward marketplace runner now passes full preflight with same-window baseline, exact round verification and transaction-tape design.
    status: PARTIAL_FIRST_COUNTABLE_PAIR_EXECUTION_STILL_REQUIRED
