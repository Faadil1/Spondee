  - id: CLM-013
    claim: Spondee backend has a deployable durable persistence path without requiring it for local demo/CI.
    truth_class: FACT
    status: VERIFIED_CODE_MEMORY_AND_POSTGRES_ADAPTERS
  - id: CLM-014
    claim: Current BSC Testnet AgenticCommerce, EvaluatorRouter and OptimisticPolicy addresses contain deployed contract code.
    truth_class: FACT
    status: VERIFIED_READ_ONLY_RPC_2026_09_03
  - id: CLM-015
    claim: The signed zero-price ERC-8183 buyer sequence is implemented and cannot execute by default.
    truth_class: FACT
    status: VERIFIED_CODE_AND_FAIL_CLOSED_TESTS_FULL_SELLER_E2E_PENDING
  - id: CLM-016
    claim: MegaFuel can sponsor ERC-8183 writes for a zero-tBNB Spondee-compatible client on BSC Testnet in the pinned runtime.
    truth_class: FACT
    status: VERIFIED_RUNTIME_ZERO_BALANCE_CREATE_AND_CANCEL
  - id: CLM-017
    claim: The Spondee Promise Card survives official SDK negotiation serialization inside success_criteria and is accepted by the buyer only after provider/chain/Commerce signature verification.
    truth_class: FACT
    status: VERIFIED_CI_LIVE_CHAIN_E2E_PENDING

