contradictions:
  - id: CON-001
    topic: testnet_gas_sponsorship
    observation: Earlier signals conflicted on whether tBNB was required for ERC-8183 writes.
    handling: Runtime run 33802027942 proved zero-balance MegaFuel writes; tBNB remains fallback-only.
    status: RESOLVED_BY_RUNTIME_PROBE
  - id: CON-002
    topic: custom_negotiation_term_survival
    observation: Injected signer tests suggested custom terms survived, but official TermSpecification drops arbitrary keys.
    handling: Use official success_criteria as the signed provenance surface.
    status: RESOLVED_BY_PROTOCOL_CONTRACT_AND_CI
  - id: CON-003
    topic: full_promise_on_chain_vs_megafuel_size
    observation: Full Promise Card in success_criteria was cryptographically sound but produced a 2223-byte JobDescription that MegaFuel rejected as an oversized raw transaction.
    handling: Keep full Promise off-chain, sign only p/s/r/SHA-256 commitment, enforce a 1600-byte Spondee description cap before createJob.
    status: RESOLVED_BY_COMPACT_COMMITMENT_AND_CI
  - id: CON-004
    topic: raw_json_task_vs_sdk_claim_sanitizer
    observation: Official SDK sanitizer replaces square brackets, which would corrupt Health Factor stress_path JSON arrays in task_description.
    handling: Encode the signed task as versioned Base64URL JSON and test roundtrip through seller fulfillment.
    status: RESOLVED_BY_TASK_CARRIER_AND_CI
