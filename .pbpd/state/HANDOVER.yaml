  second_root_cause:
    classification: SDK_PROTOCOL_SHAPE_ASSUMPTION
    finding: >-
      Spondee generated the Promise Card before signing, but the custom terms.spondee_promise field
      does not survive official @bnbagent/sdk NegotiationRequest.fromDict / TermSpecification
      reconstruction. The SDK preserves protocol fields such as deliverables, quality_standards and
      success_criteria, then hashes/signs/serializes those fields. The buyer therefore correctly
      failed before createJob when the custom field was absent.
    test_gap: >-
      The old injected signer tests observed the pre-SDK request object and therefore did not prove
      that custom terms survived the real NegotiationResult serialization path.

  applied_fix:
