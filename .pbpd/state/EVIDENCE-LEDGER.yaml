contradictions:
  - id: CON-001
    topic: testnet_gas_sponsorship
    observation: Earlier signals conflicted on whether tBNB was required for ERC-8183 writes.
    handling: Runtime evidence now includes complete Spondee buyer writes through fund with zero tBNB; tBNB remains fallback-only.
    status: RESOLVED_BY_RUNTIME_PROOF
  - id: CON-002
    topic: custom_negotiation_term_survival
    observation: Injected signer tests suggested custom terms survived, but official TermSpecification drops arbitrary keys.
    handling: Use official success_criteria as the signed provenance surface.
    status: RESOLVED_BY_PROTOCOL_CONTRACT_AND_CI
  - id: CON-003
    topic: full_promise_on_chain_vs_megafuel_size
    observation: Full Promise Card in success_criteria was cryptographically sound but produced a 2223-byte JobDescription that MegaFuel rejected.
    handling: Keep full Promise off-chain, sign only p/s/r/SHA-256 commitment, enforce a 1600-byte description cap before createJob.
    status: RESOLVED_BY_COMPACT_COMMITMENT_CI_AND_LIVE_ACCEPTANCE
  - id: CON-004
    topic: raw_json_task_vs_sdk_claim_sanitizer
    observation: Official SDK sanitizer replaces square brackets, which would corrupt Health Factor stress_path JSON arrays.
    handling: Encode the signed task as versioned Base64URL JSON and reconstruct deterministically.
    status: RESOLVED_BY_TASK_CARRIER_CI_AND_LIVE_RUNTIME
  - id: CON-005
    topic: localstorage_file_url_vs_onchain_deliverable_url
    observation: LocalStorageProvider generated a file:// manifest while the runtime requires ERC8183_AGENT_URL to publish a fetchable HTTP deliverable URL.
    handling: Start a bounded local HTTP bridge before the seller and inject ERC8183_AGENT_URL=http://127.0.0.1:9100/erc8183 into the live seller process.
    status: RESOLVED_IN_CODE_AND_CI_LIVE_SUBMIT_PENDING
  - id: CON-006
    topic: quickstart_600_second_slack_vs_recoverable_e2e
    observation: The quickstart-style 600-second provider submission slack expired before job 948 recovery, making the already-funded job permanently unsubmittable.
    handling: New G3 jobs use expiredAt = now + disputeWindow + 30 days, matching official protocol guidance for long-lived jobs; regression test and cross-platform preflight pass.
    status: RESOLVED_IN_CODE_TEST_AND_CI_LIVE_NEW_JOB_PENDING
