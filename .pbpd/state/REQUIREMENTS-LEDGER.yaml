    status: VERIFIED_G3_G4_AND_THREE_G5_COUNTABLE_PAIRS
    evidence: evidence/g5-agent-advantage-3-of-3-final/README.md
  - id: MUST-10
    class: MUST
    requirement: Agent Advantage Report contains at least three observed paired tasks.
    status: VERIFIED_READY_3_OF_3_COUNTABLE_PAIRS
    evidence: evidence/g5-agent-advantage-3-of-3-final/README.md
    note: The three preserved outcomes include one negative Grid result, one Health timing-advantage result, and one neutral Rebalancing result.
  - id: MUST-11
    class: MUST
    requirement: At least one measured task is trading-related.
    status: VERIFIED_BY_COUNTABLE_GRID_FORWARD_JOB_962
    evidence: evidence/g5-grid-forward-job-962-countable-pass/README.md
  - id: MUST-12
    class: MUST
    requirement: Baseline timings, costs and results are observed or reproducible, never invented.
    status: VERIFIED_ACROSS_THREE_COUNTABLE_FORWARD_PAIRS
    evidence: evidence/g5-agent-advantage-3-of-3-final/README.md
  - id: MUST-13
    class: MUST
    requirement: Health Factor hero measures useful warning lead time and response latency.
    status: VERIFIED_CLOSED_JOB_971_WARNING_LEAD_95_829S_RESPONSE_LATENCY_0MS
    evidence: evidence/g5-health-forward-job-971-countable-pass/README.md
