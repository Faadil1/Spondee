name: G4 Rebalancing 955 Recovery Preflight

on:
  push:
    branches: ['build/g4-sequential-live-e2e']
    paths:
      - 'backend/src/category-erc8183.ts'
      - 'backend/src/category-erc8183.test.ts'
      - 'backend/src/resume-g4-rebalancing-955.ts'
      - 'reference-agents/rebalancing/app/agent/src/executor.ts'
      - 'reference-agents/rebalancing/app/agent/src/syncNotify.test.ts'
      - 'reference-agents/rebalancing/app/agent/package.json'
      - 'reference-agents/yield/app/agent/src/executor.ts'
      - 'reference-agents/yield/app/agent/src/syncNotify.test.ts'
      - 'reference-agents/yield/app/agent/package.json'
      - 'scripts/g4-rebalancing-job-955-recovery.ps1'
      - '.github/workflows/g4-rebalancing-955-recovery-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Backend regression tests
        working-directory: backend
        run: npm test
      - name: Strict TypeScript build
        working-directory: backend
        run: npm run build
      - name: Assert bounded sync contract and no historical scan
        run: |
          grep -F 'wait_for_result: true' backend/src/category-erc8183.ts
          grep -F 'boundedNotifyFundedPayload' backend/src/resume-g4-rebalancing-955.ts
          if grep -F 'getJobSubmittedEvents' backend/src/category-erc8183.ts; then
            echo 'historical JobSubmitted scan reintroduced' >&2
            exit 1
          fi
      - name: Prove job 955 recovery cannot create a new job
        run: |
          for forbidden in 'createJob(' 'registerJob(' 'setBudget(' 'fund('; do
            if grep -F "$forbidden" backend/src/resume-g4-rebalancing-955.ts; then
              echo "forbidden write primitive in 955 recovery: $forbidden" >&2
              exit 1
            fi
          done
          grep -F 'TARGET_JOB_ID = 955n' backend/src/resume-g4-rebalancing-955.ts
          grep -F 'status) !== 1' backend/src/resume-g4-rebalancing-955.ts

  seller-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        agent: [rebalancing, yield]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm 10.24.0
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
      - name: Install frozen workspace
        working-directory: reference-agents/${{ matrix.agent }}
        run: pnpm install --frozen-lockfile
      - name: Contract tests including bounded sync notify
        working-directory: reference-agents/${{ matrix.agent }}/app/agent
        run: pnpm test
      - name: Strict TypeScript build
        working-directory: reference-agents/${{ matrix.agent }}/app/agent
        run: pnpm build

  windows-recovery-safety:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse and inspect isolated recovery runner
        shell: powershell
        run: |
          $path = 'scripts/g4-rebalancing-job-955-recovery.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "$path :: $($_.Message)" }
            exit 1
          }
          $text = Get-Content $path -Raw
          if ($text -match 'live:g4-category') { throw 'recovery runner must not invoke new-job G4 writer' }
          if ($text -match 'reference-agents\\grid\\demo') { throw 'recovery runner must not contain Grid scenario' }
          if ($text -match 'reference-agents\\yield\\demo') { throw 'recovery runner must not contain Yield scenario' }
          if ($text -match 'BUYER_WALLET_PASSWORD') { throw 'recovery runner must not unlock buyer wallet' }
          if ($text -match 'wallet:create') { throw 'recovery runner must not create seller wallet' }
          if ($text -match 'bsc-mainnet') { throw 'recovery runner must never target mainnet' }
          if ($text -notmatch 'job 955') { throw 'recovery runner is not pinned to job 955' }
          if ($text -notmatch 'No create/register/setBudget/fund') { throw 'explicit no-new-job recovery guard missing' }
          if ($text -notmatch 'SPONDEE G4 REBALANCING JOB 955 RECOVERY: PASS') { throw 'PASS terminal missing' }
          Write-Host 'Rebalancing 955 Windows recovery parse/safety: PASS'
