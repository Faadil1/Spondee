schema: PBPD-REQUIREMENTS-LEDGER-v0.1
requirements:
  - id: MUST-01
    class: MUST
    requirement: Surface all four official categories at equal product depth.
    status: PARTIAL_BACKEND_EQUAL_DEPTH_VERIFIED_HEALTH_FACTOR_AND_GRID_LIVE_REBALANCING_YIELD_PENDING
    evidence: evidence/g4-grid-job-954-final-pass/README.md
    evidence_plan: Complete comparable live find-understand-activate proof for Rebalancing and Yield.
  - id: MUST-02
    class: MUST
    requirement: Anything represented as activatable must use a real BSC-live agent/path.
    status: VERIFIED_GUARDRAIL_PLUS_HEALTH_FACTOR_AND_GRID_LIVE_PATHS
    evidence: evidence/g4-grid-job-954-final-pass/README.md
    note: Rebalancing and Yield remain non-proven in live until their sequential testnet slices pass.
  - id: MUST-03
    class: MUST
    requirement: Reuse 8004scan identity/capability data rather than rebuilding a custom registry.
    status: PARTIAL_BACKEND_SUBSTRATE_BOUNDARY_VERIFIED_DYNAMIC_INTEGRATION_PENDING
    evidence: backend/src/catalog.ts
    evidence_plan: Preserve qualified ERC-8004 candidates as discovery/comparison data while controlled Spondee paths provide activation proof.
  - id: MUST-04
    class: MUST
    requirement: Produce a task-specific Promise Card before activation.
    status: VERIFIED_BACKEND_SIMULATION_HEALTH_FACTOR_AND_GRID_LIVE
    evidence: evidence/g4-grid-job-954-final-pass/README.md
  - id: MUST-05
    class: MUST
    requirement: Promise Card includes expected outcome, confidence, downside/risk, price and relevant timing.
    status: VERIFIED_SCHEMA_AND_FOUR_CATEGORY_CI
    evidence: backend/src/contracts.ts
  - id: MUST-06
    class: MUST
    requirement: Category to successful activation has no dead end.
    status: PARTIAL_HEALTH_FACTOR_AND_GRID_LIVE_E2E_PASS_REBALANCING_YIELD_PENDING
    evidence: evidence/g4-grid-job-954-final-pass/README.md
    evidence_plan: Equivalent live activation evidence for Rebalancing and Yield.
  - id: MUST-07
    class: MUST
    requirement: Delegated execution authority is visibly bounded.
    status: PARTIAL_G3_G4_TESTNET_ZERO_PRICE_BOUNDARY_VERIFIED_PRODUCT_VISIBLE_AUTHORITY_UI_PENDING
    evidence: evidence/g4-grid-job-954-final-pass/README.md
    evidence_plan: Allowlist/cap/expiry/revoke evidence in judge-facing activation UI; Altana remains optional.
  - id: MUST-08
    class: MUST
    requirement: Every completed measured run creates an Outcome Receipt.
    status: PARTIAL_HEALTH_FACTOR_AND_GRID_LIVE_TRANSPORT_RECEIPTS_VERIFIED_SIMULATION_OBSERVED_RUNS_PENDING
    evidence: evidence/g4-grid-job-954-final-pass/README.md
  - id: MUST-09
    class: MUST
    requirement: Outcome Receipt binds original promise to actual result.
    status: VERIFIED_HEALTH_FACTOR_AND_GRID_LIVE_PROMISE_RECEIPT_BINDING_SIMULATION_EVIDENCE
    evidence: evidence/g4-grid-job-954-final-pass/README.md
    note: Binding is proven for Health Factor and Grid; both receipts remain SIMULATION and are not observed Agent Advantage.
  - id: MUST-10
    class: MUST
    requirement: Agent Advantage Report contains at least three observed paired tasks.
    status: PENDING_OBSERVED_RUNS
    evidence_plan: Final report and raw outputs; reporting engine already implemented.
  - id: MUST-11
    class: MUST
    requirement: At least one measured task is trading-related.
    status: PARTIAL_GRID_LIVE_TRANSPORT_VERIFIED_SIMULATION_OUTCOME_OBSERVED_TRADING_RUN_PENDING
    evidence: evidence/g4-grid-job-954-final-pass/README.md
    evidence_plan: Run a genuinely observed Grid Trading comparison before claiming measured trading advantage.
  - id: MUST-12
    class: MUST
    requirement: Baseline timings, costs and results are observed or reproducible, never invented.
    status: ACTIVE_VERIFIED_EVIDENCE_GUARDRAIL_OBSERVED_BASELINES_PENDING
    evidence: backend/src/evidence.ts
    evidence_plan: Raw observed baseline artifacts.
  - id: MUST-13
    class: MUST
    requirement: Health Factor hero measures useful warning lead time and response latency.
    status: PARTIAL_WARNING_LEAD_SIMULATION_VERIFIED_OBSERVED_EVENT_TAPE_PENDING
    evidence: evidence/g3-job-949-final-pass/README.md
    evidence_plan: Observed warning/event/intervention timestamps; G3 receipt remains SIMULATION.
  - id: MUST-14
    class: MUST
    requirement: Public product remains accessible during judging.
    status: PENDING_PUBLIC_DEPLOYMENT
    evidence_plan: Public URL smoke check. Current loopback deliverable URLs are not judge-accessible.
  - id: MUST-15
    class: MUST
    requirement: Failure states fail visibly rather than fabricating success.
    status: VERIFIED_CI_AND_LIVE_RUNTIME_FAIL_CLOSED_PATHS
    evidence: evidence/g4-grid-job-954-final-pass/README.md
    note: Grid preserved a truthful post-submit RPC failure, stopped the sequence, recovered without a write retry, and added a CI invariant forbidding the failing historical log-scan path.
  - id: SHOULD-01
    class: SHOULD
    requirement: Show calibration history when enough completed runs exist.
    status: IMPLEMENTED_CONDITIONALLY_OBSERVED_HISTORY_PENDING
    evidence: backend/src/evidence.ts
  - id: SHOULD-02
    class: SHOULD
    requirement: Provide Decision Replay for measured runs.
    status: PENDING
  - id: SHOULD-03
    class: SHOULD
    requirement: Use Altana scoped session authority if core integration supports it.
    status: PENDING_AFTER_FOUR_CATEGORY_CORE
  - id: SHOULD-04
    class: SHOULD
    requirement: Add genuine PancakeSwap trader/LP benefit only after core product is complete.
    status: PENDING_AFTER_FOUR_CATEGORY_CORE
  - id: SHOULD-05
    class: SHOULD
    requirement: Keep generic reputation secondary to task-specific evidence.
    status: VERIFIED_BACKEND_INFORMATION_ARCHITECTURE
    evidence: backend/src/catalog.ts
  - id: MUST_NOT-01
    class: MUST_NOT
    requirement: Do not present estimated or synthetic performance as observed real evidence.
    status: ACTIVE_AND_RUNTIME_VERIFIED_GUARDRAIL
  - id: MUST_NOT-02
    class: MUST_NOT
    requirement: Do not build custom identity/reputation infrastructure duplicating 8004scan.
    status: ACTIVE_AND_BACKEND_VERIFIED_GUARDRAIL
  - id: MUST_NOT-03
    class: MUST_NOT
    requirement: Do not claim guaranteed profit, safety or liquidation prevention.
    status: ACTIVE_AND_CI_VERIFIED_GUARDRAIL
  - id: MUST_NOT-04
    class: MUST_NOT
    requirement: Do not show an agent as activatable when activation does not work.
    status: ACTIVE_AND_HEALTH_FACTOR_GRID_LIVE_VERIFIED_GUARDRAIL
  - id: MUST_NOT-05
    class: MUST_NOT
    requirement: Do not make Health Factor substantially deeper than the other three marketplace categories.
    status: ACTIVE_LIVE_DEPTH_GAP_REDUCED_GRID_PASS_REBALANCING_YIELD_PENDING
  - id: MUST_NOT-06
    class: MUST_NOT
    requirement: Do not add bonds, auctions, leagues, generic red-team systems or orchestration platforms before core gates pass.
    status: ACTIVE_GUARDRAIL
  - id: MUST_NOT-07
    class: MUST_NOT
    requirement: Do not move meaningful real mainnet user capital without explicit human authorization.
    status: ACTIVE_GUARDRAIL
  - id: MUST_NOT-08
    class: MUST_NOT
    requirement: Do not treat LLM-generated quality scores as ground truth.
    status: ACTIVE_GUARDRAIL
