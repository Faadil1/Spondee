    claim: The signed zero-price ERC-8183 buyer sequence is implemented and cannot execute by default.
    truth_class: FACT
    status: VERIFIED_CODE_FAIL_CLOSED_TESTS_AND_LIVE_CHAIN_THROUGH_FUND
  - id: CLM-016
    claim: MegaFuel can sponsor bounded ERC-8183 writes for a zero-tBNB Spondee-compatible client on BSC Testnet in the pinned runtime.
    truth_class: FACT
    status: VERIFIED_LIVE_COMPLETE_SPONDEE_SEQUENCE_THROUGH_FUND
  - id: CLM-017
    claim: Spondee can preserve Promise provenance across official SDK negotiation serialization without embedding the full Promise Card on chain.
    truth_class: FACT
    status: VERIFIED_LIVE_COMPACT_SHA256_COMMITMENT_THROUGH_CREATE_JOB
  - id: CLM-018
    claim: Health Factor stress_path task arrays can survive official SDK claim sanitization without semantic corruption.
    truth_class: FACT
    status: VERIFIED_LIVE_TASK_RECONSTRUCTION_AND_LOCAL_DELIVERABLE_GENERATION
  - id: CLM-019
    claim: A representative compact Health Factor live JobDescription fits the Spondee 1600-byte conservative MegaFuel application budget.
    truth_class: FACT
    status: VERIFIED_CI_AND_LIVE_RELAY_ACCEPTANCE
  - id: CLM-020
    claim: The corrected G3 live path exposes LocalStorage deliverables through an HTTP URL acceptable to the pinned ERC-8183 runtime.
    truth_class: FACT
    status: VERIFIED_CI_LOCAL_HTTP_BRIDGE_LIVE_SUBMIT_PENDING
  - id: CLM-021
    claim: Newly created G3 jobs use a provider submission horizon long enough to survive deterministic recovery rather than the 10-minute quickstart slack.
    truth_class: FACT
    status: VERIFIED_CODE_TEST_AND_CI_30_DAY_HORIZON_LIVE_NEW_JOB_PENDING

