      demo_evidence_alignment: d64034bf9d1cd3b1a21a2be7c289f1acad667fc3
    security_properties:
      - Promise Card rides only through an official TermSpecification field preserved by the SDK
      - signed request and signed response each require exactly one Spondee Promise carrier
      - request and response carrier strings must match exactly
      - provider signature, chain and Commerce contract are verified before the buyer trusts the Promise Card
      - seller delivery recovers the same Promise carrier from the on-chain JobDescription terms
      - missing, malformed, duplicate or mismatched carriers fail closed before createJob
      - deterministic Outcome Receipt remains SIMULATION and cannot count as observed Agent Advantage

