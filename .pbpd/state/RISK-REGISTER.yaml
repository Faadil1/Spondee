schema: PBPD-RISK-REGISTER-v0.1
risks:
  - id: R-01
    severity: CRITICAL
    risk: Scope exceeds the Sep 9 capacity window.
    mitigation: Freeze MVP; recover Rebalancing 955 and finish Yield live proof before optional integrations; prioritize observed evidence and public judging availability.
    status: OPEN_PRIMARY_SCHEDULE_RISK
  - id: R-02
    severity: CRITICAL
    risk: Four-category depth becomes cosmetic or uneven.
    mitigation: Health Factor and Grid have verified live testnet paths; recover existing Rebalancing job 955, then require equivalent Yield proof before closing four-category depth.
    status: OPEN_REBALANCING_RECOVERY_AND_YIELD_LIVE_PROOF
  - id: R-03
    severity: HIGH
    risk: Health Factor hero demo dominates the product and weakens Agent Diversity.
    mitigation: Keep Health Factor as hero only; Grid is live-verified, Rebalancing is FUNDED/recoverable, and Yield remains the final unstarted controlled live slice.
    status: OPEN_REBALANCING_RECOVERY_AND_YIELD_LIVE_PROOF
  - id: R-04
    severity: HIGH
    risk: Agent confidence values are arbitrary or misleading.
    mitigation: Preserve forecast provenance, track calibration against actual outcomes and label insufficient history.
    status: OPEN_OBSERVED_EVIDENCE_PENDING
  - id: R-05
    severity: HIGH
    risk: Baseline comparisons are biased or invented.
    mitigation: Same initial state/window where applicable; raw baseline evidence required; invented timings prohibited.
    status: OPEN_OBSERVED_EVIDENCE_PENDING
  - id: R-06
    severity: HIGH
    risk: External agent/API instability blocks the judge path.
    mitigation: Keep external ERC-8004 candidates discovery-only when activation is opaque; controlled Spondee Agent Studio paths remain the activation fallback.
    status: CONTROLLED_BY_SPONDEE_FALLBACK_PATHS
  - id: R-07
    severity: MEDIUM
    risk: Altana integration consumes time before core Main/TermiX paths work.
    mitigation: Altana writes remain blocked until all four core categories and observed evidence are credible.
    status: CONTROLLED_BLOCKED
  - id: R-08
    severity: HIGH
    risk: Financial wording implies guarantees.
    mitigation: Use forecast/probability/outcome language and visible limitations; prohibit guarantee claims.
    status: OPEN_GUARDRAIL_ACTIVE
  - id: R-09
    severity: HIGH
    risk: JigJoy/Syndicate collision consumes the available build window.
    mitigation: Strict gate sequencing and no optional platform expansion until Spondee core is submission-ready.
    status: OPEN_CAPACITY_RISK
  - id: R-10
    severity: HIGH
    risk: Current verified deliverable URLs are loopback-only and cannot serve judges publicly.
    mitigation: Preserve local/testnet proof as evidence, then deploy a public judging build and verify public URL health before submission.
    status: OPEN_PUBLIC_DEPLOYMENT_PENDING
  - id: R-11
    severity: CRITICAL
    risk: A live ERC-8004 registration is mistaken for a proven Spondee activation path.
    mitigation: Keep every external candidate activatable=false until its advertised Agent Card/service/task interface is independently verified; wallet activity and third-party Activate buttons are insufficient evidence.
    status: CONTROLLED_EXTERNAL_CANDIDATES_DISCOVERY_ONLY
  - id: R-12
    severity: HIGH
    risk: BSC Testnet RPC eth_getLogs limits can falsely fail a live path after provider submit.
    mitigation: Resolve provider submit from a known exact transaction receipt. Historical getJobSubmittedEvents scans are forbidden in the G4 buyer and recovery paths.
    status: CONTROLLED_BY_EXACT_RECEIPT_NO_HISTORICAL_SCAN
    evidence: evidence/g4-grid-submit-receipt-remediation/README.md
  - id: R-13
    severity: HIGH
    risk: The default Agent Studio asynchronous notify_funded ACK is mistaken for a synchronous terminal provider-submit result.
    mitigation: Preserve default status=accepted behavior; Spondee controlled local proof explicitly opts into wait_for_result=true, which is covered by Rebalancing/Yield seller tests and backend parser tests.
    status: RESOLVED_IN_CODE_CI_RECOVERY_RUNTIME_PENDING
    evidence: evidence/g4-rebalancing-job-955-funded-failclosed/README.md
  - id: R-14
    severity: HIGH
    risk: A failed Rebalancing retry creates a replacement job and strands funded job 955.
    mitigation: Job 955 is the sole recovery target. Recovery backend contains no create/register/setBudget/fund primitive, runner prechecks FUNDED, and replacement-job creation is canonically forbidden.
    status: CONTROLLED_RECOVERY_GATE_ACTIVE
    evidence: evidence/g4-rebalancing-job-955-funded-failclosed/README.md
  - id: A-01
    severity: CRITICAL
    risk: No credible live BSC agent/path exists for one or more required categories.
    mitigation: Health Factor and Grid have verified controlled live paths; Rebalancing has a funded controlled job with recovery preflight PASS; Yield controlled path remains built/CI-verified but unproven live.
    status: PARTIALLY_RESOLVED_TWO_LIVE_ONE_FUNDED_ONE_PENDING
    evidence: evidence/g4-rebalancing-job-955-funded-failclosed/README.md
  - id: A-02
    severity: CRITICAL
    risk: Task-specific promises cannot be produced before activation.
    mitigation: Resolved by signed Promise commitments in Health Factor, Grid and Rebalancing job 955.
    status: RESOLVED_BY_LIVE_PATHS
  - id: A-03
    severity: HIGH
    risk: Promise-to-actual provenance cannot be bound reliably.
    mitigation: Resolved for completed Health Factor/Grid paths; Rebalancing job 955 final binding remains pending provider submit + manifest verification.
    status: RESOLVED_FOR_CLOSED_PATHS_REBALANCING_RECOVERY_PENDING
