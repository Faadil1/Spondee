[project]
name = "spondee-rebalancing-agent"

[stack]
protocols = ["A2A","MCP"]
runtime = "agentcore"

[network]
default = "bsc-testnet"

[deploy]
destination = "platform"
platform_artifact = "zip"

[wallet]
# Build/CI only in G4. No wallet unlock or deployment is authorized by this gate.
kind = "evm-local"
signer = "local"
keystore_dir = "../../.studio/wallets"
address = "0x3CC4d66BD9f872d803c1Ce063c1426fB7aec38A8"

[llm]
# Rebalancing work is deterministic for this reference-agent slice.
provider = "pieverse-llm"
model = "auto/free"

[llm.pieverse]
network = "bsc-mainnet"
initial_allocation_usd = 0

[llm.auto_renew]
enabled = false
min_balance_usd = 0.01
topup_chunk_usd = 1.0
max_topup_per_day_usd = 0.0
check_interval_seconds = 60

[payments.erc8183]
# Zero-price build/CI contract. No live job is authorized yet.
currency = "0xc70B8741B8B07A6d61E54fd4B20f22Fa648E5565"
price = "0"
min_price = "0"
max_price = "0"
quote_ttl_seconds = 900
default_estimated_completion_seconds = 120
poll_interval_seconds = 30
auto_settle = false

[storage]
kind = "local"

[payments.b402_seller]
enabled = false
price_usd = "0"
assets = ["U"]
pay_to = ""
work_timeout_seconds = 60
