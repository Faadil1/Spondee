schema: PBPD-RISK-REGISTER-v0.1
risks:
  - id: R-01
    severity: CRITICAL
    risk: Scope exceeds the Sep 9 capacity window.
    mitigation: Freeze G4 at 4/4 PASS; prioritize countable Agent Advantage evidence and public judging availability over optional integrations.
    status: OPEN_PRIMARY_SCHEDULE_RISK
  - id: R-02
    severity: CRITICAL
    risk: Four-category depth becomes cosmetic or uneven.
    mitigation: All four categories have verified bounded live BSC-testnet paths with Promise and Outcome Receipt plumbing.
    status: RESOLVED_LIVE_TRANSPORT_4_OF_4
    evidence: evidence/g4-yield-job-957-final-pass/README.md
  - id: R-03
    severity: HIGH
    risk: Health Factor hero demo dominates the product and weakens Agent Diversity.
    mitigation: Grid, Rebalancing and Yield have equivalent live transport proof; preserve comparable UI depth in the public judge build.
    status: CONTROLLED_LIVE_DEPTH_CLOSED_UI_REVIEW_PENDING
  - id: R-04
    severity: HIGH
    risk: Agent confidence values are arbitrary or misleading.
    mitigation: Preserve forecast provenance, track calibration only against observed outcomes, and label insufficient history.
    status: OPEN_OBSERVED_EVIDENCE_PENDING
  - id: R-05
    severity: CRITICAL
    risk: Baseline comparisons are biased, synthetic or invented but presented as observed Agent Advantage.
    mitigation: G5 enforces same scenario/window, raw input/agent/baseline/timing/cost artifacts, external provenance and explicit marketplace countability. Forward Grid configuration is frozen from one anchor round before any future observations.
    status: CONTROLLED_FORWARD_RUNNER_PREFLIGHT_PASS_COUNTABLE_EXECUTION_PENDING
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
  - id: R-06
    severity: HIGH
    risk: External agent/API instability blocks the judge path.
    mitigation: Keep external ERC-8004 candidates discovery-only when activation is opaque; controlled Spondee Agent Studio paths have 4/4 live proof.
    status: CONTROLLED_BY_SPONDEE_FALLBACK_PATHS
  - id: R-07
    severity: MEDIUM
    risk: Altana integration consumes time before core evidence and deployment are complete.
    mitigation: Keep Altana writes blocked until observed evidence and public judging build are credible.
    status: CONTROLLED_BLOCKED
  - id: R-08
    severity: HIGH
    risk: Financial wording implies guarantees.
    mitigation: Use forecast/probability/outcome language and visible limitations; prohibit guarantee claims.
    status: OPEN_GUARDRAIL_ACTIVE
  - id: R-09
    severity: HIGH
    risk: JigJoy/Syndicate collision consumes the available build window.
    mitigation: Strict gate sequencing and no optional platform expansion until Spondee is submission-ready.
    status: OPEN_CAPACITY_RISK
  - id: R-10
    severity: CRITICAL
    risk: Current verified deliverable URLs are loopback-only and cannot serve judges publicly.
    mitigation: Preserve local/testnet evidence, then deploy a public judging build and verify public URL/journey health before submission.
    status: OPEN_PUBLIC_DEPLOYMENT_BLOCKER
  - id: R-11
    severity: CRITICAL
    risk: A live ERC-8004 registration is mistaken for a proven Spondee activation path.
    mitigation: Keep external candidates activatable=false until their Spondee task interface is independently verified; controlled Spondee paths own activation proof.
    status: CONTROLLED_EXTERNAL_CANDIDATES_DISCOVERY_ONLY
  - id: R-12
    severity: HIGH
    risk: BSC Testnet RPC eth_getLogs limits can falsely fail a live path after provider submit.
    mitigation: G4/G5 live buyer consumes exact provider submit transaction and decodes that receipt directly; CI forbids historical JobSubmitted scans.
    status: RESOLVED_BY_DIRECT_SUBMIT_RECEIPT_AND_CI_INVARIANT
  - id: R-13
    severity: HIGH
    risk: Buyer and seller disagree on notify_funded response semantics, causing a false failure after FUND.
    mitigation: Preserve Agent Studio default async ACK, with explicit wait_for_result=true only for bounded Spondee proof; tests cover both modes.
    status: RESOLVED_BY_EXPLICIT_BOUNDED_WAIT_FOR_RESULT
  - id: R-14
    severity: HIGH
    risk: Closed G4 jobs are accidentally recreated or mutated.
    mitigation: Jobs 949/954/955/957 are canonically closed; the G5 forward runner creates a fresh scenario and allows at most one new Grid job only after explicit authorization.
    status: CONTROLLED_CLOSED_JOB_GUARD_AND_FRESH_SCENARIO
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
  - id: R-15
    severity: CRITICAL
    risk: SIMULATION or historical replay evidence is accidentally counted toward the required three observed Agent Advantage pairs.
    mitigation: Countability is separate from structural OBSERVED validity. The forward runner requires a concrete BSC-testnet activation reference, transaction tape and strictly post-activation future window before counting.
    status: RESOLVED_AT_SCHEMA_AND_RUNNER_LEVEL_EXECUTION_EVIDENCE_PENDING
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
  - id: R-16
    severity: HIGH
    risk: Observed trading evidence requires meaningful real capital or introduces unacceptable financial risk.
    mitigation: Countable Grid execution uses zero-price BSC-testnet marketplace hire plus future read-only Chainlink data and paper notional; no meaningful capital is required.
    status: CONTROLLED_FORWARD_RUNNER_PREFLIGHT_PASS
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
  - id: R-17
    severity: HIGH
    risk: A paper or observed-data Grid record is described as realized mainnet trading performance.
    mitigation: Forward pair hard-codes limitations and `realized_mainnet_pnl_claimed=false`; BSC mainnet remains read-only.
    status: CONTROLLED_CLAIM_BOUNDARY_RUNNER_VERIFIED
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
  - id: R-18
    severity: HIGH
    risk: A favorable-only experiment selection biases the Agent Advantage report.
    mitigation: The forward scenario is frozen before future Chainlink rounds and must be preserved regardless of whether Grid beats the baseline; blind retry is forbidden.
    status: CONTROLLED_BY_FORWARD_PREDECLARATION_AND_NO_RETRY_RULE
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
  - id: R-19
    severity: HIGH
    risk: Future market data leaks into Grid configuration before the observation window.
    mitigation: CI requires the generated marketplace task to contain exactly two identical anchor-price points; future rounds are accepted only when strictly after activation completion.
    status: RESOLVED_AT_RUNNER_PREFLIGHT_LEVEL
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
  - id: A-01
    severity: CRITICAL
    risk: No credible live BSC agent/path exists for one or more required categories.
    status: RESOLVED_FOUR_OF_FOUR_LIVE
  - id: A-02
    severity: CRITICAL
    risk: Task-specific promises cannot be produced before activation.
    status: RESOLVED_BY_LIVE_E2E
  - id: A-03
    severity: HIGH
    risk: Promise-to-actual provenance cannot be bound reliably.
    status: RESOLVED_BY_LIVE_E2E
  - id: A-06
    severity: CRITICAL
    risk: TermiX-style observed baselines cannot be collected reproducibly before deadline.
    mitigation: Historical dry run and forward runner both pass; remaining proof is one explicitly authorized countable forward Grid execution followed by two additional pairs.
    status: PARTIAL_FORWARD_RUNNER_PREFLIGHT_PASS_FIRST_COUNTABLE_PAIR_REQUIRED
    evidence: evidence/g5-grid-forward-runner-preflight/README.md
