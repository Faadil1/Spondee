contradictions:
  - id: CON-001
    topic: testnet_gas_sponsorship
    observation: Earlier documentation/signals were inconsistent about whether tBNB was required for general ERC-8183 operations versus paymaster coverage.
    handling: Runtime evidence takes precedence. GitHub Actions run 33802027942 proved createJob and cancelOpen from a zero-tBNB wallet with paymaster enabled; use MegaFuel first and retain tBNB only as a fallback if relay availability degrades.
    status: RESOLVED_BY_RUNTIME_PROBE
  - id: CON-002
    topic: custom_negotiation_term_survival
    observation: Earlier injected signer tests suggested terms.spondee_promise was available to fulfillment, but the official SDK TermSpecification reconstruction drops arbitrary custom term keys before the signed NegotiationResult is serialized.
    handling: Carry the versioned Promise Card in success_criteria, require exact request/response carrier equality, verify the provider signature before trusting it, and make all deterministic fixtures use the same protocol-preserved carrier.
    status: RESOLVED_BY_PROTOCOL_CONTRACT_AND_CI
