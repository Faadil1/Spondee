name: G5 Grid Forward Observed Pair Runner Preflight

on:
  push:
    branches: ['build/g4-sequential-live-e2e']
    paths:
      - 'backend/src/g5-grid-forward-observed.ts'
      - 'backend/src/g5-grid-forward-observed.test.ts'
      - 'backend/src/observed-evidence.ts'
      - 'backend/src/observed-evidence.test.ts'
      - 'scripts/g5-grid-forward-observed-pair.ps1'
      - '.github/workflows/g5-grid-forward-observed-runner-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-forward-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Backend regression and forward tests
        working-directory: backend
        run: npm test
      - name: Strict TypeScript build
        working-directory: backend
        run: npm run build
      - name: Static preflight no-write boundary
        shell: bash
        run: |
          grep -F 'countable_before_execution: false' backend/src/g5-grid-forward-observed.ts
          grep -F 'chain_write_attempted: false' backend/src/g5-grid-forward-observed.ts
          grep -F 'wallet_used: false' backend/src/g5-grid-forward-observed.ts
          grep -F 'all observed rounds must be strictly after marketplace activation completion' backend/src/g5-grid-forward-observed.ts
          grep -F 'countable_for_final_report:true' backend/src/g5-grid-forward-observed.ts
          grep -F 'realized_mainnet_pnl_claimed:false' backend/src/g5-grid-forward-observed.ts
      - name: Run read-only forward plan preflight
        working-directory: backend
        env:
          SPONDEE_G5_FORWARD_MODE: preflight
          SPONDEE_G5_OUTPUT_DIR: /tmp/spondee-g5-grid-forward-preflight
        run: npx tsx src/g5-grid-forward-observed.ts | tee /tmp/g5-forward-preflight.json
      - name: Validate preflight output
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/g5-forward-preflight.json','utf8');
          const x=JSON.parse(raw.slice(raw.indexOf('{')));
          if(x.conclusion!=='SPONDEE_G5_GRID_FORWARD_RUNNER_PREFLIGHT_PASS') throw new Error('wrong conclusion');
          if(x.wallet_used!==false||x.chain_write_attempted!==false||x.user_capital_used!==false) throw new Error('no-write boundary failed');
          if(x.execution_authorized!==false||x.countable_pair_created!==false) throw new Error('preflight opened execution/countability');
          const task=JSON.parse(fs.readFileSync('/tmp/spondee-g5-grid-forward-preflight/marketplace-task.json','utf8'));
          if(task.declared_price_path.length!==2||task.declared_price_path[0].price!==task.declared_price_path[1].price) throw new Error('look-ahead path leaked into task');
          console.log(JSON.stringify({pair_id:x.plan.pair_id,anchor:x.plan.anchor,task_schema:task.schema},null,2));
          NODE

  windows-runner-safety:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell runner without executing it
        shell: powershell
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\g5-grid-forward-observed-pair.ps1'),[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error $_};exit 1}
      - name: Verify execution seal precedes wallet prompt
        shell: powershell
        run: |
          $p=Get-Content '.\scripts\g5-grid-forward-observed-pair.ps1' -Raw
          $guard=$p.IndexOf("SPONDEE_G5_GRID_FORWARD_EXECUTION_AUTHORIZATION")
          $prompt=$p.IndexOf("Read-Host 'Seller wallet password'")
          if($guard -lt 0 -or $prompt -lt 0 -or $guard -gt $prompt){throw 'Execution authorization guard must precede wallet prompt'}
          if($p -notmatch "I_AUTHORIZE_ONE_ZERO_PRICE_BSC_TESTNET_GRID_FORWARD_OBSERVED_ACTIVATION"){throw 'Missing exact one-run authorization token'}
          if($p -notmatch "Closed jobs 949/954/955/957 must never be touched"){throw 'Missing closed-job guard'}
          if($p -match "mainnet.*write.*allowed"){throw 'Unexpected mainnet write allowance'}
