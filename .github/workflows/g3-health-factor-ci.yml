name: G3 Health Factor CI

on:
  push:
    branches: ['build/g3-health-factor']
    paths:
      - 'reference-agents/health-factor/**'
      - '.github/workflows/g3-health-factor-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'reference-agents/health-factor/**'

permissions:
  contents: read

jobs:
  windows-powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse wallet helper with Windows PowerShell
        shell: powershell
        run: |
          $path = 'reference-agents/health-factor/scripts/g3-create-testnet-wallet.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'Windows PowerShell wallet helper syntax: PASS'

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate

      - name: Install workspace dependencies
        working-directory: reference-agents/health-factor
        run: pnpm install --frozen-lockfile

      - name: Inspect installed BNB wallet APIs
        working-directory: reference-agents/health-factor/app/agent
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const runtime = await import('@bnbagent/studio-runtime/wallet');
          const sdk = await import('@bnbagent/sdk/wallets');
          console.log('runtime wallet exports:', Object.keys(runtime).sort().join(', '));
          console.log('sdk wallet exports:', Object.keys(sdk).sort().join(', '));
          NODE
          echo '--- EVMWalletProvider declaration ---'
          FILE=$(grep -R -l 'declare class EVMWalletProvider' node_modules/@bnbagent/sdk/dist | head -n 1)
          if [ -n "$FILE" ]; then
            LINE=$(grep -n 'declare class EVMWalletProvider' "$FILE" | head -n1 | cut -d: -f1)
            START=$((LINE-35)); if [ "$START" -lt 1 ]; then START=1; fi
            END=$((LINE+115))
            sed -n "${START},${END}p" "$FILE"
          else
            echo 'EVMWalletProvider declaration not found' >&2
            exit 1
          fi

      - name: Validate local PowerShell wallet helper syntax
        shell: pwsh
        run: |
          $path = 'reference-agents/health-factor/scripts/g3-create-testnet-wallet.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell wallet helper syntax: PASS'

      - name: Run deterministic Spondee tests
        working-directory: reference-agents/health-factor/app/agent
        run: pnpm test

      - name: TypeScript build
        working-directory: reference-agents/health-factor/app/agent
        run: pnpm build

      - name: Export reproducible Promise and Receipt evidence
        working-directory: reference-agents/health-factor/app/agent
        run: pnpm demo:evidence

      - name: Upload deterministic demo evidence
        uses: actions/upload-artifact@v4
        with:
          name: spondee-g3-health-factor-demo-evidence
          path: reference-agents/health-factor/demo-output/
          if-no-files-found: error
          retention-days: 14

      - name: Agent Studio project diagnostics without global CLI
        working-directory: reference-agents/health-factor/app/agent
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const toml = readFileSync('studio.toml', 'utf8');
          if (!toml.includes('default = "bsc-testnet"')) throw new Error('bsc-testnet not configured');
          if (!toml.includes('price = "0"')) throw new Error('G3 ERC-8183 price must remain zero');
          console.log('Studio config safety checks: PASS');
          NODE
